[package]
name = "dust-runner-87"
version = "0.1.0"
description = "Dust Runner '87 desktop shell"
edition = "2021"

[lib]
name = "dust_runner_87_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
