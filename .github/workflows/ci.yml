name: CI and deploy

# Every push and PR: typecheck, unit tests, build, smoke test in a real browser.
# Pushes to main (and manual runs on main) also publish the web build to GitHub Pages — that's the shareable link.
# Halloween event (branch halloween-2026): the same checks, then it publishes ONLY the event, so nobody reaches the full game:
#   /DR87/ and /DR87/halloween/  both serve the Halloween Night build
#   /DR87/sw.js                  retires the full game's offline cache in browsers that visited it before
#   /DR87/<secret>/              the full game from main, for debugging; the folder name comes from the repo secret
#                                DEBUG_PATH (Settings → Secrets and variables → Actions), so it never appears in this public file
# Needs halloween-2026 allowed in Settings → Environments → github-pages → Deployment branches.
# After the event, re-run the workflow on main to bring the regular game back.
on:
  push:
    branches: [main, halloween-2026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/web/dist

      # ---- Halloween event: the site is the event only ----
      - name: Assemble the event site
        if: github.ref == 'refs/heads/halloween-2026' && github.event_name != 'pull_request'
        run: |
          mkdir -p site/halloween && cp -r apps/web/dist/. site/ && cp -r apps/web/dist/. site/halloween/
          cp tools/halloween/retire-sw.js site/sw.js
      - name: Add the full game under the secret debug folder
        if: github.ref == 'refs/heads/halloween-2026' && github.event_name != 'pull_request'
        env:
          DEBUG_PATH: ${{ secrets.DEBUG_PATH }}
        run: |
          if [ -z "$DEBUG_PATH" ]; then echo "No DEBUG_PATH secret: no debug copy of the full game"; exit 0; fi
          case "$DEBUG_PATH" in *[!A-Za-z0-9_-]*) echo "DEBUG_PATH may only use letters, digits, - and _"; exit 1;; esac
          git fetch --depth 1 origin main
          git worktree add ../main-src origin/main
          (cd ../main-src && npm ci && npm run build)
          mkdir -p "site/$DEBUG_PATH" && cp -r ../main-src/apps/web/dist/. "site/$DEBUG_PATH/"
          # keep it out of search engines
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' "site/$DEBUG_PATH/index.html"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/halloween-2026' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/halloween-2026') && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
