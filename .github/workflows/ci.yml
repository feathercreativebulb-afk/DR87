name: CI and deploy

# Every push and PR: typecheck, unit tests, build, smoke test in a real browser.
# Pushes to main (and manual runs on main) also publish the web build to GitHub Pages — that's the shareable link.
# Halloween event (branch halloween-2026): the same checks, then it publishes the site with BOTH games:
#   /DR87/            the regular game, built from main
#   /DR87/halloween/  the Halloween Night event build from this branch
# Needs halloween-2026 allowed in Settings → Environments → github-pages → Deployment branches.
on:
  push:
    branches: [main, halloween-2026]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/web/dist

      # ---- Halloween event: put the event under /halloween/ next to the regular game from main ----
      - name: Build the regular game from main
        if: github.ref == 'refs/heads/halloween-2026' && github.event_name != 'pull_request'
        run: |
          git fetch --depth 1 origin main
          git worktree add ../main-src origin/main
          cd ../main-src && npm ci && npm run build
      - name: Assemble the site (main at the root, the event under /halloween/)
        if: github.ref == 'refs/heads/halloween-2026' && github.event_name != 'pull_request'
        run: |
          mkdir -p site && cp -r ../main-src/apps/web/dist/. site/ && mkdir -p site/halloween && cp -r apps/web/dist/. site/halloween/
          # the regular game's offline cache must never answer for the event (it would serve a stale event build)
          sed -i "s#if (req.method !== 'GET' || new URL(req.url).origin !== self.location.origin) return;#if (req.method !== 'GET' || new URL(req.url).origin !== self.location.origin || new URL(req.url).pathname.includes('/halloween/')) return;#" site/sw.js
          grep -q "/halloween/" site/sw.js
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/halloween-2026' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/halloween-2026') && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
